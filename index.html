<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grădina mea 🌳</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌳%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Fredoka','Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif,'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji';
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);background:#bfe6ff;color:#3b2a1a;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
#app{display:grid;grid-template-columns:minmax(270px,32%) 1fr;height:100vh;height:100dvh}

/* ---------- Magazinul ---------- */
#shop{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:#fff8e7 repeating-linear-gradient(0deg,transparent 0 38px,rgba(214,170,110,.16) 38px 40px);border-right:8px solid #c98d52;z-index:2}
.awning{flex:none;height:44px;position:relative;z-index:2;background:repeating-linear-gradient(90deg,#ef5350 0 36px,#fff 36px 72px)}
.awning::after{content:'';position:absolute;left:0;right:0;top:100%;height:16px;background:radial-gradient(circle at 18px 0,#ef5350 17px,transparent 18px) 0 0/72px 16px repeat-x,radial-gradient(circle at 54px 0,#fff 17px,transparent 18px) 0 0/72px 16px repeat-x;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
.shop-title{margin:24px 8px 10px;text-align:center;font-size:clamp(20px,2.2vw,30px);line-height:1.1;color:#c62828;text-shadow:0 2px 0 #fff}
#tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 10px 10px}
.tab{border:none;border-radius:18px;padding:6px 2px 4px;background:#fff;box-shadow:0 4px 0 #e0c9a6;display:flex;flex-direction:column;align-items:center;color:#7a5a3a;font-size:13px;font-weight:600;transition:transform .1s}
.tab .ti{font-size:30px;line-height:1.15}
.tab .ti svg{width:1em;height:1em;display:block;margin:.075em 0}
.tab.on{background:var(--c);color:#fff;box-shadow:0 4px 0 var(--cd);transform:translateY(-2px)}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #e0c9a6}
#shopGrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));align-content:start;gap:14px 12px;padding:8px 12px 28px}
.item{position:relative;border:4px solid var(--c);border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--cd);padding:6px 5px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s,filter .25s,opacity .25s}
.item:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.item.locked{filter:grayscale(.8);opacity:.55}
.item .prev{position:relative;width:100%;height:100px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;border-radius:14px;overflow:hidden;background:linear-gradient(#e3f6ff 0 calc(100% - 18px),#9fd47f calc(100% - 18px))}
.item .prev .pv,.item .prev .fr{animation:none}
.item .badge{position:absolute;top:3px;right:5px;font-size:30px;line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.badge svg{width:1em;height:1em;display:block}
.item .iname{font-size:15px;font-weight:600;color:#5a3d22;line-height:1.05;text-align:center;min-height:2.1em;display:flex;align-items:center}
.price{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:700;color:#b26a00;background:#fff3c4;border-radius:999px;padding:0 12px 0 6px;line-height:1.3}
.item.shake{animation:shake .45s}

/* ---------- Bănuț ---------- */
.coin{display:inline-block;position:relative;width:1em;height:1em;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fffde0 0 12%,#ffd54f 35%,#ffb300 72%,#e69500 100%);box-shadow:inset 0 0 0 .07em #e69500,0 .06em 0 #a86400}
.coin::after{content:'';position:absolute;inset:24%;border-radius:50%;border:.065em solid rgba(168,100,0,.55)}

/* ---------- Căsuța ---------- */
#home{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(#5db8ff,#bfe6ff 170px)}
.sky{position:relative;flex:none;height:158px;display:flex;align-items:center;gap:14px;padding:0 16px 30px;z-index:3}
.sun{position:absolute;top:6px;left:46%;font-size:54px;line-height:1;animation:spin 40s linear infinite;z-index:-1}
.cloud{position:absolute;line-height:1;z-index:-1;animation:drift linear infinite;opacity:.95}
.cloud.c1{top:4px;font-size:58px;animation-duration:70s;animation-delay:-20s}
.cloud.c2{top:44px;font-size:40px;animation-duration:95s;animation-delay:-60s}
.house-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.house{font-size:78px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.home-title{margin:0;font-size:clamp(22px,2.6vw,36px);color:#fff;line-height:1.05;text-shadow:0 3px 0 #2b7bc0,0 0 14px rgba(0,0,0,.12)}
.piggy{position:relative;margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:5px solid #f48fb1;border-radius:999px;padding:4px 22px 4px 8px;box-shadow:0 6px 0 #d8608b;flex:none}
.pig{font-size:62px;line-height:1;display:inline-block}
.piggy>.coin{font-size:40px}
#coinNum{font-size:50px;font-weight:700;color:#b26a00;min-width:1.3em;text-align:center;line-height:1}
.piggy.bump .pig{animation:bump .35s}
.piggy.bump #coinNum{animation:numBump .35s}
.piggy.sad{animation:shake .45s}
#bubble{position:absolute;top:100%;right:6px;margin-top:14px;background:#fff;border:4px solid #f48fb1;border-radius:18px;padding:4px 14px;font-size:24px;font-weight:700;color:#c2185b;white-space:nowrap;display:flex;align-items:center;gap:6px;opacity:0;transform:translateY(-8px) scale(.9);transition:.2s;pointer-events:none;z-index:6}
#bubble::before{content:'';position:absolute;bottom:100%;right:40px;border:10px solid transparent;border-bottom-color:#f48fb1}
#bubble.show{opacity:1;transform:none}
.tools{display:flex;flex-direction:column;gap:8px;flex:none}
.tool{width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.88);font-size:22px;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;padding:0}
.tool:active{transform:translateY(2px)}
.fence{position:absolute;left:0;right:0;bottom:-2px;height:36px;z-index:-1;
  background:
    linear-gradient(transparent 10px,#fff6e3 10px 16px,transparent 16px 25px,#fff6e3 25px 31px,transparent 31px),
    repeating-linear-gradient(90deg,transparent 0 6px,#fffaf0 6px 22px,transparent 22px 34px);
  filter:drop-shadow(0 2px 0 rgba(120,80,40,.25))}

#garden{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background-color:#7ccf5a;background-image:radial-gradient(circle,#68bc47 2px,transparent 2.6px),radial-gradient(circle,#94de72 1.6px,transparent 2.2px);background-size:26px 26px,34px 34px;background-position:0 0,13px 17px;box-shadow:inset 0 10px 0 #5fb043}
#plots{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:24px 18px;padding:26px 16px 60px}
#emptyHint{display:none;flex-direction:column;align-items:center;gap:0;padding-top:34px;font-size:32px;font-weight:700;color:#fff;text-shadow:0 3px 0 #3c8a2a;text-align:center}
#emptyHint .arrow{font-size:90px;line-height:1;animation:pointLeft 1s ease-in-out infinite}
.empty #emptyHint{display:flex}

/* ---------- Plante în grădină ---------- */
.plot{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.plot.new{animation:popIn .6s cubic-bezier(.3,1.6,.5,1)}
.plot.hidden{visibility:hidden}
.area{position:relative}
.soil{position:absolute;left:12%;right:12%;bottom:0;height:30px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#a1887f,#6d4c41 60%,#4e342e);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.ripe .soil{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 5px rgba(255,236,120,.55),0 0 24px 8px rgba(255,240,150,.6)}
.pvw{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:flex-end}
.pv{position:relative;container-type:inline-size;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.pv>svg{display:block;width:100%;height:auto;overflow:visible}
.pv.emo{container-type:normal;line-height:1;margin-bottom:-8px}
.pv.drink{animation:drink .9s ease-in-out}
.pv.grow{animation:grow .8s cubic-bezier(.3,1.7,.5,1)}
.fr{position:absolute;translate:-50% -50%;line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.28))}
.fr svg{display:block;width:1em;height:1em}
.ripe .fr{animation:fruitIn .55s cubic-bezier(.3,1.7,.5,1) backwards,bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.09s),calc(var(--i)*.33s)}
.tw{position:absolute;font-size:22px;line-height:1;pointer-events:none;animation:twinkle 1.8s ease-in-out infinite}
.tw.t1{left:4%;top:8%}
.tw.t2{right:2%;top:30%;animation-delay:.6s}
.tw.t3{left:42%;top:-8%;animation-delay:1.2s}
.name{margin-top:4px;font-size:15px;font-weight:600;color:#2f5d1e;background:rgba(255,255,255,.78);border-radius:10px;padding:0 10px;white-space:nowrap}
.bar{display:flex;align-items:center;gap:8px;margin-top:6px;height:68px}
.act{width:64px;height:64px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.act.water{background:#4fc3f7;box-shadow:0 5px 0 #0288d1;animation:nudge 3s ease-in-out infinite}
.act.water svg{width:46px;height:auto;display:block}
.act.harvest{background:#ffd54f;box-shadow:0 5px 0 #f9a825;font-size:36px;animation:pulse 1.1s ease-in-out infinite}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.drops{display:flex;flex-direction:column;gap:7px}
.drops i{display:block;width:15px;height:15px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:#e3edf1;box-shadow:inset 0 0 0 2px #a9c1ca}
.drops i.full{background:#29b6f6;box-shadow:inset 0 0 0 2px #0277bd}
.drops i.just{animation:dropFill .55s cubic-bezier(.3,1.8,.5,1)}

/* stropitoarea + picături */
.fxl{position:absolute;inset:0;pointer-events:none;z-index:5}
.can{position:absolute;top:-6px;width:70px;transform-origin:30% 80%;animation:canPour 1.25s ease-in-out forwards}
.can svg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.drop{position:absolute;width:10px;height:10px;border-radius:0 50% 50% 50%;background:#4fc3f7;box-shadow:inset -2px -2px 0 rgba(2,119,189,.35);opacity:0;animation:dropFall .65s ease-in forwards}
.splash{position:absolute;bottom:10px;width:8px;height:8px;border-radius:50%;background:#81d4fa;opacity:0;animation:splash .5s ease-out forwards}

/* efecte globale */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx>*{position:absolute;left:0;top:0;will-change:transform}
.spark{font-size:30px;line-height:1}
.flyer{line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.flyer svg{width:1em;height:1em;display:block}
.packet{width:58px;height:70px;border-radius:6px 6px 12px 12px;background:linear-gradient(#fff6e6,#ffdcae);border:3px solid #d29b5c;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 5px 10px rgba(0,0,0,.25)}
.packet::before{content:'';position:absolute;left:-3px;right:-3px;top:-9px;height:10px;background:linear-gradient(135deg,transparent 50%,#d29b5c 50%) 0 0/10px 10px repeat-x}
.packet svg{width:1em;height:1em;display:block}
.bravo{font-size:44px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 3px 0 #e65100,0 0 12px rgba(255,160,0,.6)}
.plus{font-size:40px;font-weight:700;color:#ffb300;white-space:nowrap;text-shadow:0 3px 0 #fff,0 0 8px #fff}
.wplus,.wminus{font-size:32px;font-weight:700;color:#0288d1;white-space:nowrap;text-shadow:0 2px 0 #fff,0 0 8px #fff}
.tip{background:#fff;border:4px solid var(--tc,#f48fb1);border-radius:18px;padding:4px 14px;font-size:24px;font-weight:700;color:#37474f;white-space:nowrap;line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.tip::before{content:'';position:absolute;bottom:100%;left:calc(var(--ax,50%) - 10px);border:10px solid transparent;border-bottom-color:var(--tc,#f48fb1)}

/* ---------- Rezervorul de apă + cămara ---------- */
.supplies{display:flex;align-items:center;gap:12px;flex:none}
.tank{position:relative;flex:none;width:62px;height:104px;border:none;background:none;padding:0;display:block}
.tank:active{transform:translateY(2px)}
.tank-cap{position:absolute;left:17px;right:17px;top:0;height:14px;border-radius:7px 7px 2px 2px;background:#78909c;box-shadow:inset 0 -3px 0 #546e7a}
.tank-body{position:absolute;left:3px;right:3px;top:10px;bottom:5px;border-radius:14px 14px 18px 18px;border:4px solid #546e7a;background:linear-gradient(90deg,#eef6fb,#d6e9f5 45%,#f5fbff);overflow:hidden;box-shadow:0 5px 0 #37474f;transform-origin:50% 100%}
.tank-water{position:absolute;left:0;right:0;bottom:0;height:calc(var(--lvl,1) * 100%);background:linear-gradient(90deg,#29b6f6,#4fc3f7 40%,#0288d1);transition:height .9s ease-in-out}
.tank.init .tank-water{transition:none}
.tank-water::before{content:'';position:absolute;left:0;width:200%;top:-5px;height:6px;background:radial-gradient(ellipse at 50% 100%,#4fc3f7 65%,transparent 68%) 0 0/14px 6px repeat-x;animation:wave 1.4s linear infinite}
.tank-marks{position:absolute;left:0;top:0;bottom:0;width:9px;background:repeating-linear-gradient(transparent 0 calc(25% - 2px),rgba(55,71,79,.45) calc(25% - 2px) 25%)}
.tank-glass{position:absolute;left:12px;top:6px;bottom:10px;width:6px;border-radius:3px;background:rgba(255,255,255,.5)}
.tank-num{position:absolute;left:0;right:0;top:50%;translate:0 -50%;text-align:center;font-size:24px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 3px #01579b,0 2px 0 #01579b,2px 0 0 #01579b,-2px 0 0 #01579b,0 -2px 0 #01579b}
.tank-plus{position:absolute;right:-10px;top:-4px;width:30px;height:30px;border-radius:50%;background:#66bb6a;border:3px solid #fff;color:#fff;font-size:24px;font-weight:700;line-height:23px;text-align:center;box-shadow:0 3px 0 #2e7d32}
.tank.low .tank-body{border-color:#e53935;box-shadow:0 5px 0 #b71c1c;animation:lowGlow 1s ease-in-out infinite}
.tank.low .tank-plus{animation:pulse .9s ease-in-out infinite}
.tank.shake,.chip.shake{animation:shake .45s}
.bub{position:absolute;bottom:4px;width:8px;height:8px;border-radius:50%;border:2px solid rgba(255,255,255,.9);opacity:0;animation:bubUp 1s ease-out forwards}
.pantry{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:6px;flex:none}
.pantry[hidden]{display:none}
.chip{display:flex;align-items:center;gap:3px;border:3px solid #ffcc80;border-radius:999px;background:rgba(255,255,255,.95);padding:1px 10px 1px 3px;box-shadow:0 3px 0 #e0a35a;font-size:20px;font-weight:700;color:#8d5a2b;line-height:1}
.chip .fi{font-size:24px;line-height:1.1}
.chip b{min-width:1.1em;text-align:center}
.chip.zero{border-color:#ef9a9a;color:#c62828;box-shadow:0 3px 0 #e57373}
.chip.zero .fi{filter:grayscale(.7);opacity:.6}
.chip:active{transform:translateY(2px)}

/* ---------- Animale ---------- */
.ground{position:absolute;left:8%;right:8%;bottom:0;height:28px;border-radius:50%}
.farm .ground{background:radial-gradient(ellipse at 50% 35%,#fff3c4,#e8c96a 55%,#c49c3e);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.pet .ground{background:radial-gradient(ellipse at 50% 40%,#fce4ec 0 38%,#f48fb1 40% 72%,#ec407a 74%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.ripe .ground{box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 0 0 5px rgba(255,236,120,.55),0 0 24px 8px rgba(255,240,150,.6)}
.avw{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:flex-end}
.av{line-height:1;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18))}
.av .ae{display:inline-block}
.av.flip .ae{transform:scaleX(-1)}
.av.munch{animation:munch .6s ease-in-out}
.av.hop{animation:hop .65s cubic-bezier(.3,1.5,.5,1)}
.ext{position:absolute;inset:0;pointer-events:none}
.fr.prod{font-size:30px}
.want{position:absolute;top:0;right:2px;width:46px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.12);animation:wantBob 2.2s ease-in-out infinite}
.want::before,.want::after{content:'';position:absolute;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.want::before{width:12px;height:12px;left:-3px;bottom:-5px}
.want::after{width:7px;height:7px;left:-11px;bottom:-13px}
.act.feed{background:#ffb74d;box-shadow:0 5px 0 #ef6c00;font-size:36px;animation:nudge 3s ease-in-out infinite}
.act.water.dry,.act.feed.nofood{background:#cfd8dc;box-shadow:0 5px 0 #90a4ae;animation:none}
.act.water.dry svg{filter:grayscale(1);opacity:.7}
.act.feed.nofood{filter:grayscale(.9);opacity:.8}
.drops.pips i{border-radius:50%;transform:none;background:#f6ead8;box-shadow:inset 0 0 0 2px #d7b98f}
.drops.pips i.full{background:#ffb300;box-shadow:inset 0 0 0 2px #e65100}
.drops.pips i.just{animation:pipFill .55s cubic-bezier(.3,1.8,.5,1)}

/* ---------- Pisica care se plimbă ---------- */
#roam{position:absolute;left:0;top:0;width:100%;height:0;z-index:4;pointer-events:none}
.walker{position:absolute;left:0;top:0;width:116px;height:90px;pointer-events:auto;cursor:pointer;will-change:transform}
.walker.hidden{visibility:hidden}
.walker .area{position:relative;width:116px;height:90px}
.walker .area::before{content:'';position:absolute;left:20%;right:20%;bottom:-4px;height:12px;border-radius:50%;background:rgba(40,80,20,.25)}
.walker.ripe .area::before{box-shadow:0 0 0 5px rgba(255,236,120,.55),0 0 22px 8px rgba(255,240,150,.6)}
.cat-flip.left{transform:scaleX(-1)}
.cat-body{transform-origin:50% 100%}
.cat-body svg{display:block;width:116px;height:90px;overflow:visible}
.c-leg{transform-box:fill-box;transform-origin:50% 0}
.c-tail{transform-box:view-box;transform-origin:24px 50px;animation:tailSway 1.8s ease-in-out infinite}
.c-tail path{transition:stroke-width .2s}
.c-torso{transform-box:fill-box;transform-origin:50% 100%;transition:transform .2s}
.c-eye{transform-box:fill-box;transform-origin:50% 50%;transition:transform .2s}
.c-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.5s infinite}
.c-head{transform-box:fill-box;transform-origin:20% 90%}
.walker.walking .c-leg{animation:legSwing .44s ease-in-out infinite}
.walker.walking .l2,.walker.walking .l3{animation-delay:-.22s}
.walker.walking .cat-body{animation:catBob .44s ease-in-out infinite}
.walker.fleeing .c-leg,.walker.fleeing .cat-body{animation-duration:.18s}
.walker.fleeing .l2,.walker.fleeing .l3{animation-delay:-.09s}
.walker.scared .c-torso{transform:translateY(-5px) scaleY(1.18)}
.walker.scared .c-tail{animation:none;transform:rotate(28deg)}
.walker.scared .c-tail path{stroke-width:13}
.walker.scared .c-eye{transform:scale(1.5)}
.walker.jump .cat-body{animation:scareJump .65s cubic-bezier(.3,1.3,.5,1)}
.walker.hop .cat-body{animation:hop .65s cubic-bezier(.3,1.5,.5,1)}
.walker.munch .c-head{animation:catMunch .6s ease-in-out}
.walker.new .area{animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
.walker .want{top:-38px;right:-14px;width:42px;height:38px;font-size:22px}
.walker .fr.prod{font-size:26px}
.wk-pips{position:absolute;left:50%;top:100%;translate:-50% 6px;display:flex;gap:4px}
.wk-pips i{display:block;width:12px;height:12px;border-radius:50%;background:#f6ead8;box-shadow:inset 0 0 0 2px #d7b98f}
.wk-pips i.full{background:#ffb300;box-shadow:inset 0 0 0 2px #e65100}
.picker{position:absolute;left:50%;bottom:calc(100% + 40px);translate:-50% 0;display:flex;gap:12px;padding:8px 12px;background:#fff;border:4px solid #ffb74d;border-radius:24px;box-shadow:0 5px 0 rgba(0,0,0,.15);animation:popIn .3s cubic-bezier(.3,1.6,.5,1)}
.picker::after{content:'';position:absolute;top:100%;left:50%;translate:-50% 0;border:12px solid transparent;border-top-color:#ffb74d}
.picker.below{bottom:auto;top:calc(100% + 30px)}
.picker.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#ffb74d}
.pick{position:relative;width:62px;height:62px;border-radius:50%;border:4px solid #fff;background:#ffe0b2;box-shadow:0 4px 0 #ef6c00;font-size:34px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.pick[data-food="cucumber"]{background:#c8e6c9;box-shadow:0 4px 0 #2e7d32}
.pick b{position:absolute;right:-9px;bottom:-7px;min-width:26px;height:26px;padding:0 4px;border-radius:999px;background:#fff;border:3px solid #8d6e63;color:#5d4037;font-size:14px;line-height:20px}
.pick.none{filter:grayscale(.9);opacity:.6}
.pick:active{transform:translateY(3px)}
.cuke{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer}
.cuke span{display:block;font-size:42px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));animation:cukeWobble 1.2s ease-in-out infinite}
.dust{position:absolute;left:0;top:0;font-size:26px;line-height:1;pointer-events:none}
.scare-bub{position:absolute;left:50%;bottom:100%;font-size:40px;line-height:1;white-space:nowrap;pointer-events:none}
.cat-prev{width:92px;margin-bottom:-4px}
.cat-prev svg{display:block;width:100%;height:auto}
@keyframes legSwing{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes catBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tailSway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes scareJump{0%{transform:translateY(0)}35%{transform:translateY(-60px) scale(1.05,1.1)}70%{transform:translateY(0) scale(1.1,.88)}100%{transform:translateY(0)}}
@keyframes catMunch{0%,100%{transform:rotate(0)}25%{transform:rotate(12deg)}50%{transform:rotate(2deg)}75%{transform:rotate(12deg)}}

/* ---------- Țarcuri cu gard ---------- */
#pens{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:36px 22px;padding:36px 12px 4px}
#pens:empty{display:none}
.pen{position:relative;max-width:100%;padding:20px 12px 18px}
.pen-ground{position:absolute;inset:20px 8px 14px;border-radius:12px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.05)}
.g-grass .pen-ground{background:#6cc04b radial-gradient(circle,#5aae3c 2px,transparent 2.6px) 0 0/24px 24px}
.g-soil .pen-ground{background:repeating-linear-gradient(#8d6e63 0 16px,#7d5f54 16px 26px)}
.g-farm .pen-ground{background:#e9d38f radial-gradient(circle,#d4b866 2px,transparent 2.6px) 0 0/18px 18px}
.g-pet .pen-ground{background:#a6e08a radial-gradient(circle,#93d576 2.5px,transparent 3px) 0 0/26px 26px}
.fe{position:absolute;pointer-events:none;transform-origin:50% 100%}
.fe-t,.fe-b{left:0;right:0;height:38px;background:var(--ft) repeat-x 0 0/auto 38px}
.fe-t{top:0}
.fe-b{bottom:-6px;z-index:3}
.fe-l,.fe-r{top:20px;bottom:14px;width:16px;background:var(--fs) repeat-y 0 0/16px auto}
.fe-l{left:0}
.fe-r{right:0}
.pen-items{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:24px 18px;min-width:230px;min-height:170px;padding:34px 18px 26px}
.pen-ghost{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:84px;line-height:1;opacity:.32;cursor:pointer}
.pen.empty .pen-ghost{display:flex}
.pen-sign{position:absolute;top:-18px;left:50%;translate:-50% 0;z-index:4;display:flex;align-items:center;gap:6px;padding:3px 14px 3px 8px;border-radius:12px;background:linear-gradient(#c08552,#a86f3c);border:3px solid #7a4a22;color:#fff8e7;font-size:19px;font-weight:700;white-space:nowrap;box-shadow:0 4px 0 rgba(90,50,20,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.pen-sign .si{font-size:26px;line-height:1}
.pen.new .fe{animation:fenceUp .55s cubic-bezier(.3,1.6,.5,1) backwards}
.pen.new .fe-l,.pen.new .fe-r{animation-delay:.15s}
.pen.new .fe-b{animation-delay:.3s}
.pen.new .pen-ground{animation:fadeIn .4s backwards}
.pen.new .pen-sign{animation:popIn .5s .45s cubic-bezier(.3,1.6,.5,1) backwards}

/* ---------- Magazin: animale, hrană, garduri ---------- */
.item .prev .av{animation:none;filter:drop-shadow(0 3px 1px rgba(0,0,0,.15))}
.food-tag{position:absolute;left:5px;bottom:4px;width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.qty{display:block;font-size:17px;font-weight:700;line-height:1.2;color:#00796b;background:#fff;border:3px solid #26a69a;border-radius:999px;padding:0 7px}
.sack{position:relative;width:78px;height:78px}
.sack svg{width:100%;height:100%;display:block}
.sack .si{position:absolute;left:50%;top:60%;translate:-50% -50%;font-size:32px;line-height:1}
.barrel{width:64px}
.barrel svg{width:100%;height:auto;display:block}
.fence-prev{position:absolute;left:0;right:0;bottom:8px;height:44px;background:var(--ft) repeat-x 0 0/auto 44px}
.item.hint{animation:hint .8s ease-in-out 3}

.modal .box.pen-box{width:min(640px,94vw);max-height:92vh;overflow-y:auto;padding:20px 22px 24px}

.kgroup{margin:4px 2px 8px;font-size:20px;font-weight:700;color:#5d4037;text-align:left}
.kind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px;margin-bottom:14px}
.kopt{position:relative;border:4px solid #c5e1a5;border-radius:18px;background:#fff;box-shadow:0 5px 0 #9ccc65;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;font-weight:600;color:#33691e;line-height:1.1}
.kopt .ki{font-size:46px;line-height:1.1}
.kopt.has{border-color:#ffb74d;box-shadow:0 5px 0 #f57c00}

.kopt:disabled{cursor:default;opacity:.45;filter:grayscale(.8)}
.kopt:disabled::after{content:'✔';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#2e7d32}
.kopt:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 #9ccc65}

/* fluture */
.butterfly{position:absolute;font-size:34px;line-height:1;pointer-events:none;z-index:4;animation:flutter 34s ease-in-out infinite}
.butterfly span{display:inline-block;animation:flap .35s ease-in-out infinite}

}

function plantVisual(d, stage, scale = 1) {
  const T = TYPES[d.type];
  if (stage === 0) {
    if (d.cat === 'tree') return `<div class="pv emo" style="font-size:${44 * scale}px">🌱</div>`;
    return `<div class="pv" style="width:${50 * scale}px">${SEED_SVG}</div>`;
  }
  if (stage === 1) {
    if (d.cat === 'tree') return `<div class="pv" style="width:${74 * scale}px">${wrapSvg([100, 130], youngTreeSVG(d.pal))}</div>`;
    return `<div class="pv emo" style="font-size:${54 * scale}px">🌱</div>`;
  }
  let html = `<div class="pv" style="width:${T.w[stage] * scale}px">${wrapSvg(T.vb, baseSVG(d, stage))}`;

    T.pos.forEach(([x, y, fs], i) => {

const Sound = {
  ctx: null, noiseBuf: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  get on() { return !state.muted && this.ctx; },
  tone(f, t0, dur, type = 'sine', vol = .2, f2) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime + t0;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .015);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + .05);
  },
  noise(t0, dur, vol, freq) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime + t0;
    if (!this.noiseBuf) {
      const len = c.sampleRate * 1.5;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const data = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .9;
    const g = c.createGain();
    const a = Math.min(.12, dur * .4);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t); src.stop(t + dur + .05);
  },
  // ton cu vibrato, trecut printr-un filtru (pentru glasurile animalelor)
  vib(f, t0, dur, type, vol, f2, rate, depth) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime + t0;
    const o = c.createOscillator(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain(), flt = c.createBiquadFilter();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    lfo.frequency.value = rate; lg.gain.value = depth;
    lfo.connect(lg).connect(o.frequency);
    flt.type = 'lowpass'; flt.frequency.value = 1800;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .05);
    g.gain.setValueAtTime(vol, t + dur * .7);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(flt).connect(g).connect(c.destination);
    o.start(t); lfo.start(t); o.stop(t + dur + .05); lfo.stop(t + dur + .05);
  },
  sweep(pts, type = 'triangle', vol = .15) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime, end = t + pts[pts.length - 1][0];
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(pts[0][1], t);
    pts.slice(1).forEach(([dt, f]) => o.frequency.exponentialRampToValueAtTime(f, t + dt));
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .04);
    g.gain.setValueAtTime(vol, end - .1);
    g.gain.exponentialRampToValueAtTime(.0001, end);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(end + .05);
  },
  pop()   { this.tone(380, 0, .14, 'sine', .3, 950); this.tone(1200, .08, .12, 'triangle', .12, 1600); },
  water() { this.noise(.15, .75, .16, 2600); [.25, .42, .6, .78].forEach((t, i) => this.tone(700 + i * 90, t, .09, 'sine', .14, 1500 + i * 120)); },
  grow()  { [523, 659, 784].forEach((f, i) => this.tone(f, i * .09, .2, 'triangle', .2)); },
  fruit() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .3, 'triangle', .22)); [1568, 2093, 2637].forEach((f, i) => this.tone(f, .5 + i * .07, .25, 'sine', .08)); },
  coin()  { this.tone(988, 0, .08, 'square', .06); this.tone(1319, .07, .28, 'square', .06); },
  nope()  { this.tone(330, 0, .16, 'triangle', .22, 300); this.tone(250, .16, .25, 'triangle', .22, 200); },
  click() { this.tone(660, 0, .06, 'sine', .12, 880); },
  glug()  { [0, .1, .2, .3, .4].forEach((t, i) => this.tone(240 + i * 50, t, .1, 'sine', .2, 520 + i * 70)); },
  munch() { [0, .15, .3].forEach(t => this.noise(t, .09, .22, 1400)); },
  hammer() { [0, .24, .48].forEach(t => { this.tone(200, t, .1, 'square', .08, 90); this.noise(t, .07, .22, 2800); }); },
  scared() { this.sweep([[0, 650], [.1, 1500], [.45, 800]], 'sawtooth', .09); this.noise(.05, .5, .2, 5000); },
  whoosh() { this.noise(0, .35, .12, 900); },
  voice(v) {
    switch (v) {
      case 'cluck':  [0, .13, .26].forEach((t, i) => this.tone(620 - i * 40, t, .08, 'square', .05, 420)); break;
      case 'quack':  [0, .24].forEach(t => this.vib(480, t, .18, 'sawtooth', .14, 360, 28, 30)); break;
      case 'baa':    this.vib(440, 0, .75, 'sawtooth', .14, 400, 9, 28); break;
      case 'moo':    this.vib(170, 0, 1.1, 'sawtooth', .2, 120, 4, 5); break;
      case 'meow':   this.sweep([[0, 520], [.18, 880], [.55, 480]], 'triangle', .2); break;
      case 'woof':   [0, .26].forEach(t => { this.tone(300, t, .15, 'square', .07, 140); this.noise(t, .12, .12, 700); }); break;
      case 'squeak': [0, .15].forEach(t => this.tone(1700, t, .09, 'sine', .14, 2500)); break;
      case 'tweet':  [0, .1, .2].forEach(t => this.tone(2300, t, .07, 'sine', .1, 3300)); break;
    }
  },
};

function freshState() {
  return {
    coins: START_COINS, plants: [], animals: [], pens: [],
    water: WATER_CAP, food: { grain: 0, hay: 0, bone: 0, fish: 0, cucumber: 0 },
    next: 1, tab: 'tree', muted: false,
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// Citește jocul salvat; dacă nu există, preia grădina din versiunea veche
function readSaved() {
  for (const k of [KEY, OLD_KEY]) {
    try {
      const s = JSON.parse(localStorage.getItem(k));
      if (s && typeof s.coins === 'number' && Array.isArray(s.plants)) return s;
    } catch (e) { /* stare coruptă: încercăm mai departe */ }
  }
  return null;
}
function loadState() {
  const s = freshState(), raw = readSaved();
  if (!raw) return s;
  s.coins = Math.max(0, Math.floor(raw.coins));
  s.plants = raw.plants.filter(p => p && BY_ID[p.id] && isPlant(BY_ID[p.id])).map(p => ({
    u: p.u | 0, id: p.id, s: clamp(p.s | 0, 0, 3), w: Math.max(0, p.w | 0),
  }));
  s.animals = (Array.isArray(raw.animals) ? raw.animals : []).filter(a => a && BY_ID[a.id] && isAnimal(BY_ID[a.id])).map(a => {
    const r = !!a.r;
    return { u: a.u | 0, id: a.id, f: r ? 0 : clamp(a.f | 0, 0, BY_ID[a.id].feeds - 1), r };
  });
  const fenced = new Set();
  // țarcurile pentru pisici nu mai există (pisica se plimbă liberă): dăm bănuții înapoi
  (Array.isArray(raw.pens) ? raw.pens : []).forEach(p => {
    if (p && BY_ID[p.kind] && BY_ID[p.kind].roam && FENCE_STYLES[p.style]) s.coins += FENCE_STYLES[p.style].price;
  });
  s.pens = (Array.isArray(raw.pens) ? raw.pens : [])
    .filter(p => p && KIND_BY[p.kind] && FENCE_STYLES[p.style] && !fenced.has(p.kind) && fenced.add(p.kind))
    .map(p => ({ u: p.u | 0, kind: p.kind, style: p.style }));
  if (typeof raw.water === 'number') s.water = clamp(Math.floor(raw.water), 0, WATER_CAP);
  if (raw.food) for (const k in s.food) s.food[k] = Math.max(0, raw.food[k] | 0);
  s.next = Math.max(raw.next | 0, 1, ...[...s.plants, ...s.animals, ...s.pens].map(x => x.u + 1));
  if (CATS[raw.tab]) s.tab = raw.tab;
  s.muted = !!raw.muted;
  return s;
}

const PROD_POS = { farm: [[14, 80], [86, 80], [50, 94]], pet: [[16, 30], [84, 26], [50, 8]] };
const animalArea = d => [Math.max(124, Math.round(d.size * 1.75)), Math.round(d.size * 1.3 + 48)];

function animalHTML(d, flip, size = d.size) {

/* ---------- țarcuri ---------- */
function makePen(pen) {
  const K = KIND_BY[pen.kind];
  const el = document.createElement('div');
  el.className = `pen fs-${pen.style} g-${K.ground}`;

    + `<div class="fe fe-b"></div><div class="pen-sign"><span class="si">${K.icon}</span>${K.name}</div>`;

// unde stă un lucru nou: în țarcul lui, dacă are, altfel în curte
function boxFor(kind) {

}
function updatePens() {

function renderGarden() {

  pensEl.innerHTML = '';
  plotsEl.innerHTML = '';
  roamEl.innerHTML = '';
  walkers.clear();
  cukes.forEach(c => clearTimeout(c.timer));

  state.pens.forEach(pen => pensEl.appendChild(makePen(pen)));

  all.filter(x => !BY_ID[x.id].roam).forEach(x => {

  });

function updateEmpty() { gardenEl.classList.toggle('empty', !state.plants.length && !state.animals.length && !state.pens.length); }

const findItem = u => state.plants.find(x => x.u === u) || state.animals.find(x => x.u === u);

/* ---------- rezervor + cămară ---------- */
let waterTimer;
function renderTank() {
  tankEl.style.setProperty('--lvl', (state.water / WATER_CAP).toFixed(3));
  tankEl.classList.toggle('low', state.water <= 5);
  tankEl.setAttribute('aria-label', `Rezervorul de apă: ${state.water} litri din ${WATER_CAP}. Apasă ca să cumperi apă.`);
  refreshNeeds();
  clearInterval(waterTimer);
  const diff = Math.abs(state.water - shownWater);
  if (!diff) { waterNumEl.textContent = shownWater; return; }
  // cifra scade/crește pas cu pas, cât timp se mișcă apa
  waterTimer = setInterval(() => {
    shownWater += Math.sign(state.water - shownWater);
    waterNumEl.textContent = shownWater;
    if (shownWater === state.water) clearInterval(waterTimer);
  }, Math.max(35, Math.min(220, 850 / diff)));
}

const chipEl = k => pantryEl.querySelector(`[data-food="${k}"]`);
// în cămară apar doar mâncărurile de care e nevoie (sau care există)
function pantryFoods() {
  const need = new Set(state.animals.map(a => BY_ID[a.id].food));
  if (state.animals.some(a => BY_ID[a.id].roam)) need.add('cucumber');
  return Object.keys(FOODS).filter(k => need.has(k) || state.food[k] > 0);
}
function renderPantry() {
  const list = pantryFoods();
  pantryEl.hidden = !list.length;
  pantryEl.innerHTML = list.map(k =>
    `<button class="chip${state.food[k] ? '' : ' zero'}" data-food="${k}" aria-label="${FOODS[k].name}: ${state.food[k]}"><span class="fi">${FOODS[k].icon}</span><b>${state.food[k]}</b></button>`
  ).join('');

}

// butoanele de udat / hrănit devin gri când nu mai ajunge apa / mâncarea
function refreshNeeds() {
  gardenEl.querySelectorAll('.plot').forEach(el => {
    const x = findItem(+el.dataset.u), b = el.querySelector('.act.water, .act.feed');
    if (!x || !b) return;
    const d = BY_ID[x.id];

    else b.classList.toggle('nofood', state.food[d.food] < 1);
  });
}

function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* =========================================================
   EFECTE
   ========================================================= */
const center = r => ({ x: r.left + r.width / 2, y: r.top + r.height / 2 });
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// Zbor pe o curbă (pentru semințe și roade)
function fly(el, from, to, { dur = 800, lift = 120, s0 = 1, s1 = .6, spin = 0 } = {}) {
  fxEl.appendChild(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  const x0 = from.x - w / 2, y0 = from.y - h / 2, x1 = to.x - w / 2, y1 = to.y - h / 2;
  const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - lift;
  const frames = [];
  for (let i = 0; i <= 14; i++) {
    const t = i / 14, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    const x = a * x0 + b * cx + c * x1, y = a * y0 + b * cy + c * y1;
    const s = s0 + (s1 - s0) * t + Math.sin(t * Math.PI) * .25;
    frames.push({ transform: `translate(${x}px,${y}px) scale(${s}) rotate(${spin * t}deg)` });
  }
  return el.animate(frames, { duration: dur, easing: 'ease-in-out', fill: 'forwards' }).finished
    .then(() => el.remove(), () => el.remove());
}

function burst(x, y, n = 18, set = ['⭐', '🌟', '✨', '💖', '🎉', '⭐']) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = pick(set);
    s.style.fontSize = rand(20, 36) + 'px';
    fxEl.appendChild(s);
    const a = (i / n) * Math.PI * 2 + rand(-.2, .2), dist = rand(70, 150);
    const dx = Math.cos(a) * dist, dy = Math.sin(a) * dist;
    s.animate([
      { transform: `translate(${x}px,${y}px) translate(-50%,-50%) scale(.2)`, opacity: 1 },
      { transform: `translate(${x + dx}px,${y + dy}px) translate(-50%,-50%) scale(1.2) rotate(${rand(-180, 180)}deg)`, opacity: 1, offset: .65 },
      { transform: `translate(${x + dx * 1.1}px,${y + dy * 1.1 + 40}px) translate(-50%,-50%) scale(.5)`, opacity: 0 },
    ], { duration: rand(1100, 1500), easing: 'cubic-bezier(.2,.8,.3,1)' }).finished.then(() => s.remove());
  }
}

function floatText(x, y, html, cls, dur = 1300, rise = 80) {
  const t = document.createElement('div');
  t.className = cls;
  t.innerHTML = html;
  fxEl.appendChild(t);
  t.animate([
    { transform: `translate(${x}px,${y}px) translate(-50%,-50%) scale(.3)`, opacity: 0 },
    { transform: `translate(${x}px,${y - rise * .4}px) translate(-50%,-50%) scale(1.15)`, opacity: 1, offset: .25 },
    { transform: `translate(${x}px,${y - rise * .6}px) translate(-50%,-50%) scale(1)`, opacity: 1, offset: .7 },
    { transform: `translate(${x}px,${y - rise}px) translate(-50%,-50%) scale(.9)`, opacity: 0 },
  ], { duration: dur, easing: 'ease-out' }).finished.then(() => t.remove());
}

let bubbleTimer;
function showBubble(html) {
  bubbleEl.innerHTML = html;
  bubbleEl.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), 1800);
}

// Bulă cu mesaj, sub un element (rezervor, cămară...)
let tipEl;
function tip(anchor, html, color = '#f48fb1') {
  if (tipEl) tipEl.remove();
  const r = anchor.getBoundingClientRect();
  const t = tipEl = document.createElement('div');
  t.className = 'tip';
  t.innerHTML = html;
  t.style.setProperty('--tc', color);
  fxEl.appendChild(t);
  const w = t.offsetWidth, cx = r.left + r.width / 2;
  const x = Math.max(8, Math.min(innerWidth - w - 8, cx - w / 2)), y = r.bottom + 14;
  t.style.setProperty('--ax', (cx - x) + 'px');
  t.animate([
    { transform: `translate(${x}px,${y - 8}px) scale(.9)`, opacity: 0 },
    { transform: `translate(${x}px,${y}px)`, opacity: 1, offset: .1 },
    { transform: `translate(${x}px,${y}px)`, opacity: 1, offset: .88 },
    { transform: `translate(${x}px,${y}px)`, opacity: 0 },
  ], { duration: 2300, fill: 'forwards' }).finished.then(() => t.remove(), () => t.remove());
}

// pornește o animație CSS și scoate clasa la final (ca să nu blocheze alte animații)
function flash(el, cls) {
  restart(el, cls);
  const off = e => { if (e.target === el) { el.classList.remove(cls); el.removeEventListener('animationend', off); } };
  el.addEventListener('animationend', off);
}
const bumpEl = el => el && el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)', offset: .4 }, { transform: 'scale(1)' }], { duration: 350 });

function tankBubbles() {
  for (let i = 0; i < 7; i++) {
    const b = document.createElement('i');
    b.className = 'bub';
    b.style.left = rand(10, 75) + '%';
    b.style.animationDelay = rand(0, .5) + 's';
    tankBodyEl.appendChild(b);
    setTimeout(() => b.remove(), 1700);
  }
}

/* =========================================================
   ACȚIUNI
   ========================================================= */
// Plătește din pușculiță; dacă nu ajung bănuții, porcușorul se supără
function pay(price, el) {
  if (state.coins < price) {
    Sound.nope();
    if (el) flash(el, 'shake');
    restart(piggyEl, 'sad');
    showBubble(`🐷 Încă ${price - state.coins} <span class="coin"></span>`);
    return false;
  }
  state.coins -= price;
  shownCoins -= price;
  renderCoins();
  updateLocks();
  restart(piggyEl, 'bump');
  Sound.click();
  const pr = center(piggyEl.getBoundingClientRect());
  floatText(pr.x, pr.y + 40, `−${price} <span class="coin"></span>`, 'plus', 1100, 50);
  return true;
}

function placeNew(el, d) {
  el.classList.add('hidden');
  boxFor(kindOf(d)).appendChild(el);
  updateEmpty();
  updatePens();
  el.scrollIntoView({ block: 'nearest' });
}

function buy(d, itemEl) {
  if (!pay(d.price, itemEl)) return;
  const p = { u: state.next++, id: d.id, s: 0, w: 0 };
  state.plants.push(p);
  save();

  const el = makePlot(p);
  placeNew(el, d);

  const packet = document.createElement('div');
  packet.className = 'packet';
  packet.innerHTML = fruitHTML(d, 0);
  const from = center(itemEl.querySelector('.prev').getBoundingClientRect());
  const ar = el.querySelector('.area').getBoundingClientRect();
  const to = { x: ar.left + ar.width / 2, y: ar.bottom - 30 };
  fly(packet, from, to, { dur: 850, lift: 140, s0: 1, s1: .45, spin: 20 }).then(() => {
    el.classList.remove('hidden');
    restart(el, 'new');
    Sound.pop();
    burst(to.x, to.y - 10, 8, ['✨', '🌱', '✨']);
  });
}

function buyAnimal(d, itemEl) {
  if (!pay(d.price, itemEl)) return;
  const a = { u: state.next++, id: d.id, f: 0, r: false };
  state.animals.push(a);
  save();
  renderPantry();
  if (d.roam) { buyWalker(a, itemEl); return; }

  const el = makeAnimal(a);
  placeNew(el, d);

  const fl = document.createElement('div');
  fl.className = 'flyer';
  fl.textContent = d.emo;
  fl.style.fontSize = Math.round(d.size * .8) + 'px';
  const from = center(itemEl.querySelector('.prev').getBoundingClientRect());
  const to = center(el.querySelector('.av').getBoundingClientRect());
  fly(fl, from, to, { dur: 950, lift: 170, s0: 1, s1: 1.2 }).then(() => {
    el.classList.remove('hidden');
    restart(el, 'new');
    Sound.voice(d.voice);
    burst(to.x, to.y, 10, ['💖', '✨', '🐾', '✨']);
  });
}

/* ---------- apă ---------- */
// pisica sare din magazin direct în grădină, într-un loc care se vede
function buyWalker(a, itemEl) {
  const d = BY_ID[a.id];
  bounds = roamBounds();
  const pos = {
    x: rand(bounds.x0, bounds.x1),
    y: clamp(gardenEl.scrollTop + gardenEl.clientHeight * rand(.45, .8), bounds.y0, bounds.y1),
  };
  const w = makeWalker(a, pos);
  w.mode = 'eat';
  w.el.classList.add('hidden');
  updateEmpty();
  const fl = document.createElement('div');
  fl.className = 'flyer';
  fl.innerHTML = CAT_SVG;
  fl.style.fontSize = '96px';
  const from = center(itemEl.querySelector('.prev').getBoundingClientRect());
  const to = toScreen({ x: pos.x, y: pos.y - CAT_H / 2 });
  fly(fl, from, to, { dur: 950, lift: 170, s0: .9, s1: 1 }).then(() => {
    w.el.classList.remove('hidden');
    pulseClass(w.el, 'new', 600);
    Sound.voice(d.voice);
    burst(to.x, to.y, 10, ['💖', '✨', '🐾', '✨']);
    setMode(w, 'idle', performance.now() + 900);
  });
}

/* ---------- apă ---------- */
function buyWater(d, el) {
  if (state.water >= WATER_CAP) {
    Sound.nope();
    flash(tankEl, 'shake');
    tip(tankEl, 'Rezervorul e plin! 💧', '#29b6f6');
    return;
  }
  if (!pay(d.price, el)) return;
  const add = Math.min(d.amount, WATER_CAP - state.water);
  state.water += add;
  save();
  const fill = () => {
    const tr = tankBodyEl.getBoundingClientRect();
    renderTank();
    Sound.glug();
    tankBubbles();
    floatText(tr.left + tr.width / 2, tr.top + 10, `+${add} 💧`, 'wplus', 1300, 50);
  };
  if (el === tankEl) { fill(); return; }
  const drop = document.createElement('div');
  drop.className = 'flyer';
  drop.textContent = '💧';
  drop.style.fontSize = '50px';
  fly(drop, center(el.querySelector('.prev').getBoundingClientRect()), center(tankBodyEl.getBoundingClientRect()),
    { dur: 800, lift: 120, s0: 1, s1: .6 }).then(fill);
}

function needWater() {
  Sound.nope();
  flash(tankEl, 'shake');
  tip(tankEl, 'Nu ajunge apa! Cumpără 💧', '#29b6f6');
  showInShop('apa');
}

// apa pleacă din rezervor spre stropitoare, iar nivelul scade cât timp se udă
function drainTank(amount, areaEl, canLeft) {
  const tr = tankBodyEl.getBoundingClientRect(), ar = areaEl.getBoundingClientRect();
  const drop = document.createElement('div');
  drop.className = 'flyer';
  drop.textContent = '💧';
  drop.style.fontSize = '30px';
  fly(drop, center(tr), { x: ar.left + canLeft + 30, y: ar.top + 14 }, { dur: 450, lift: 70, s0: 1, s1: .7 });
  tankBodyEl.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-3deg)', offset: .2 }, { transform: 'rotate(2.5deg)', offset: .45 }, { transform: 'rotate(-1.5deg)', offset: .7 }, { transform: 'rotate(0)' }], { duration: 900 });
  setTimeout(() => {
    renderTank();
    floatText(tr.left + tr.width / 2, tr.bottom + 10, `−${amount}`, 'wminus', 1200, -36);
  }, 200);
}

/* ---------- hrană ---------- */
function buyFood(d, itemEl) {
  if (!pay(d.price, itemEl)) return;
  state.food[d.supply] += d.amount;
  save();
  renderPantry();
  const F = FOODS[d.supply];
  const from = center(itemEl.querySelector('.prev').getBoundingClientRect());
  const to = center(chipEl(d.supply).getBoundingClientRect());
  for (let i = 0; i < 3; i++) {
    setTimeout(() => {
      const fl = document.createElement('div');
      fl.className = 'flyer';
      fl.textContent = F.icon;
      fl.style.fontSize = '38px';
      fly(fl, from, to, { dur: 700, lift: 120, s0: 1, s1: .6, spin: rand(-90, 90) }).then(() => {
        bumpEl(chipEl(d.supply));
        if (i === 2) Sound.pop();
      });
    }, i * 120);
  }
}

function needFood(food) {
  Sound.nope();
  const chip = chipEl(food);
  if (chip) flash(chip, 'shake');
  tip(chip || pantryEl, `Cumpără ${FOODS[food].icon} ${FOODS[food].name.toLowerCase()}!`, '#ffa726');
  showInShop(SUPPLY_FOR[food]);
}

// deschide raionul potrivit din magazin și arată lucrul de cumpărat
function showInShop(id) {
  const d = BY_ID[id];
  setTab(d.cat);
  const it = gridEl.querySelector(`[data-id="${id}"]`);
  if (it) { it.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); flash(it, 'hint'); }
}

function feed(el, a) {
  const d = BY_ID[a.id], F = FOODS[d.food];
  if (state.food[d.food] < 1) { needFood(d.food); return; }
  busy.add(a.u);
  const chip = chipEl(d.food);
  const from = center((chip || el.querySelector('.act')).getBoundingClientRect());

  state.food[d.food]--;
  a.f++;
  if (a.f >= d.feeds) { a.r = true; a.f = 0; }
  save();
  renderPantry();
  bumpEl(chipEl(d.food));

  const av = el.querySelector('.av'), r = av.getBoundingClientRect();
  const to = { x: r.left + r.width / 2, y: r.top + r.height * .55 };
  const fl = document.createElement('div');
  fl.className = 'flyer';
  fl.textContent = F.icon;
  fl.style.fontSize = '42px';
  Sound.click();
  fly(fl, from, to, { dur: 750, lift: 110, s0: .9, s1: .5, spin: 40 }).then(() => {
    restart(av, 'munch');
    Sound.munch();
    burst(to.x, to.y - 10, 6, ['💛', '✨', '💖']);
    setTimeout(() => Sound.voice(d.voice), 320);
    setTimeout(() => {
      if (a.r) { updateAnimal(el, a); celebrate(el); }
      else renderAnimalBar(el, a, a.f - 1);
      busy.delete(a.u);
    }, 650);
  });
}

function collect(el, a) {
  const d = BY_ID[a.id];
  a.r = false; a.f = 0;
  payout(el, a.u, d.reward, () => {
    updateAnimal(el, a);
    restart(el.querySelector('.av'), 'hop');
    Sound.voice(d.voice);
  });
}

/* ---------- garduri ---------- */
let pendingFence = null;
function openPenChooser(d, itemEl) {
  if (state.coins < d.price) { pay(d.price, itemEl); return; }
  const fenced = new Set(state.pens.map(p => p.kind));
  if (KINDS.every(K => fenced.has(K.k))) {
    Sound.nope();
    flash(itemEl, 'shake');
    tip(itemEl, 'Toate au deja gard! 👍');
    return;
  }
  pendingFence = { d, itemEl };
  const counts = {};
  [...state.plants, ...state.animals].forEach(x => { const k = kindOf(BY_ID[x.id]); counts[k] = (counts[k] || 0) + 1; });
  const opt = K => {
    const done = fenced.has(K.k), n = counts[K.k];
    return `<button class="kopt${n && !done ? ' has' : ''}" data-kind="${K.k}"${done ? ' disabled' : ''} aria-label="${K.name}"><span class="ki">${K.icon}</span><span class="kn">${K.name}</span>${n && !done ? `<span class="kc">${n}</span>` : ''}</button>`;
  };
  kindListEl.innerHTML = `<div class="kgroup">🌱 Plante</div><div class="kind-grid">${KINDS.filter(K => PLANT_CATS.includes(K.k)).map(opt).join('')}</div>`
    + `<div class="kgroup">🐾 Animale</div><div class="kind-grid">${KINDS.filter(K => !PLANT_CATS.includes(K.k)).map(opt).join('')}</div>`;
  penStripEl.className = `pen-strip fs-${d.style}`;
  penModal.hidden = false;
  Sound.click();
}
function closePenChooser() { pendingFence = null; penModal.hidden = true; }

function buildPen(kind) {
  if (!pendingFence) return;
  const { d, itemEl } = pendingFence;
  closePenChooser();
  if (!pay(d.price, itemEl)) return;
  const pen = { u: state.next++, kind, style: d.style };
  state.pens.push(pen);
  save();

  // tot ce e de felul ales se mută în țarcul nou (cu animație)
  const plots = [...gardenEl.querySelectorAll('.plot')];
  const first = new Map(plots.map(el => [el, el.getBoundingClientRect()]));
  const penEl = makePen(pen);
  pensEl.appendChild(penEl);
  const box = penEl.querySelector('.pen-items');
  [...plotsEl.children].filter(el => el.dataset.kind === kind).forEach(el => box.appendChild(el));
  updateEmpty();
  updatePens();
  plots.forEach(el => {
    const a = first.get(el), b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) + Math.abs(dy) > 1) {
      el.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }], { duration: 750, easing: 'cubic-bezier(.3,1.2,.5,1)' });
    }
  });
  restart(penEl, 'new');
  Sound.hammer();
  penEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  setTimeout(() => {
    const r = penEl.querySelector('.pen-sign').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 12, ['✨', '⭐', '🔨', '✨']);
  }, 500);
}

function water(el, p) {
  const d = BY_ID[p.id], T = TYPES[d.type], C = CATS[d.cat];
  if (state.water < C.wl) { needWater(); return; }
  busy.add(p.u);

  // starea se salvează imediat; animația vine după
  state.water -= C.wl;
  p.w++;
  let grew = false;
  if (p.w >= C.wps) { p.s = Math.min(3, p.s + 1); p.w = 0; grew = true; }
  save();

  Sound.water();
  const fxl = el.querySelector('.fxl');
  const canLeft = T.area[0] / 2 - 84;
  drainTank(C.wl, el.querySelector('.area'), canLeft);
  const can = document.createElement('div');
  can.className = 'can';
  can.innerHTML = CAN_SVG;
  can.style.left = canLeft + 'px';
  fxl.appendChild(can);
  const parts = [can];
  for (let i = 0; i < 14; i++) {
    const dr = document.createElement('i');
    dr.className = 'drop';
    dr.style.left = (canLeft + 62 + rand(-6, 10)) + 'px';
    dr.style.top = '14px';
    dr.style.setProperty('--dx', rand(-4, 46) + 'px');
    dr.style.setProperty('--fall', (T.area[1] - 40 + rand(-10, 10)) + 'px');
    dr.style.animationDelay = rand(.32, .85) + 's';
    fxl.appendChild(dr);
    parts.push(dr);
  }
  for (let i = 0; i < 6; i++) {
    const sp = document.createElement('i');
    sp.className = 'splash';
    sp.style.left = (T.area[0] / 2 + rand(-24, 24)) + 'px';
    sp.style.setProperty('--sx', rand(-20, 20) + 'px');
    sp.style.animationDelay = rand(.85, 1.15) + 's';
    fxl.appendChild(sp);
    parts.push(sp);
  }
  const pv = el.querySelector('.pv');
  setTimeout(() => pv && restart(pv, 'drink'), 450);

  setTimeout(() => {
    parts.forEach(x => x.remove());
    if (grew) {
      updatePlot(el, p);
      const npv = el.querySelector('.pv');
      restart(npv, 'grow');
      const r = center(el.querySelector('.area').getBoundingClientRect());
      if (p.s >= 3) celebrate(el);
      else { Sound.grow(); burst(r.x, r.y, 8, ['✨', '🍃', '✨']); }
    } else {
      updatePlot(el, p, p.w - 1);
    }
    busy.delete(p.u);
  }, 1300);
}

function celebrate(el) {
  Sound.fruit();
  const r = el.querySelector('.area').getBoundingClientRect();
  const c = center(r);
  burst(c.x, c.y - 10, 22);
  floatText(c.x, r.top + 10, pick(['Bravo!', 'Super!', 'Ura!', 'Ce frumos!', 'Uau!']), 'bravo', 1600, 70);
}

function harvest(el, p) {
  const d = BY_ID[p.id];
  p.s = 2; p.w = 0;
  payout(el, p.u, d.reward, () => {
    updatePlot(el, p);
    restart(el.querySelector('.pv'), 'grow');
  });
}

// roadele / produsele zboară în pușculiță și se fac bănuți
function payout(el, u, reward, done) {
  busy.add(u);
  const fruits = [...el.querySelectorAll('.fr')];
  const n = Math.max(1, fruits.length);
  const base = Math.floor(reward / n);
  let extra = reward - base * n;
  const shares = Array.from({ length: n }, () => base + (extra-- > 0 ? 1 : 0));

  state.coins += reward;
  save();
  updateLocks();

  const target = center(piggyEl.querySelector('.pig').getBoundingClientRect());
  const jobs = fruits.map((fr, i) => {
    const r = fr.getBoundingClientRect();
    const fl = document.createElement('div');
    fl.className = 'flyer';
    fl.innerHTML = fr.innerHTML;
    fl.style.fontSize = getComputedStyle(fr).fontSize;
    const from = center(r);
    return new Promise(res => setTimeout(() => {
      fr.style.visibility = 'hidden';
      fly(fl, from, target, { dur: 750, lift: rand(60, 140), s0: 1.2, s1: .5, spin: rand(-200, 200) }).then(() => {
        shownCoins += shares[i];
        renderCoins();
        restart(piggyEl, 'bump');
        Sound.coin();
        res();
      });
    }, i * 110));
  });
  Sound.pop();

  Promise.all(jobs).then(() => {
    shownCoins = state.coins;
    renderCoins();
    floatText(target.x, target.y + 50, `+${reward} <span class="coin"></span>`, 'plus', 1300, 60);
    burst(target.x, target.y, 10, ['✨', '⭐', '💛']);
    done();
    busy.delete(u);
  });
}

/* =========================================================
   PISICA CARE SE PLIMBĂ
   ========================================================= */
const walkers = new Map();   // u -> pisică care se plimbă
let cukes = [];              // castraveți lăsați pe jos (pisica fuge de ei)
let bounds = null, threats = [], openPicker = null;
const CAT_W = 116, CAT_H = 90;
const CAT_HEARTS = [[18, 6], [82, 0], [50, -14]];

// punct din grădină (coordonate în conținutul care se derulează)
function gardenPoint(el) {
  const g = gardenEl.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2 - g.left, y: r.bottom - g.top + gardenEl.scrollTop, w: r.width, h: r.height };
}
function toScreen(p) {
  const g = gardenEl.getBoundingClientRect();
  return { x: p.x + g.left, y: p.y + g.top - gardenEl.scrollTop };
}
function roamBounds() {
  const g = gardenEl.getBoundingClientRect();
  let bottom = gardenEl.clientHeight;
  [pensEl, plotsEl].forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.height) bottom = Math.max(bottom, r.bottom - g.top + gardenEl.scrollTop);
  });
  return { x0: 64, x1: Math.max(70, gardenEl.clientWidth - 64), y0: 130, y1: Math.max(140, bottom - 24) };
}

function makeWalker(a, pos) {
  const el = document.createElement('div');
  el.className = 'walker';
  el.dataset.u = a.u;
  el.innerHTML = `<div class="area"><div class="cat-flip"><div class="cat-body">${CAT_SVG}</div></div><div class="ext"></div></div><div class="wk-pips"></div>`;
  roamEl.appendChild(el);
  const b = bounds || roamBounds();
  const w = {
    a, el, x: pos ? pos.x : rand(b.x0, b.x1), y: pos ? pos.y : rand(b.y0, b.y1),
    tx: 0, ty: 0, mode: 'idle', until: performance.now() + rand(400, 1800),
    face: Math.random() < .5 ? 1 : -1, speed: 70, cool: 0, dust: 0,
  };
  walkers.set(a.u, w);
  renderWalker(w);
  placeWalker(w);
  return w;
}
function placeWalker(w) {
  w.el.style.transform = `translate(${Math.round(w.x - CAT_W / 2)}px,${Math.round(w.y - CAT_H)}px)`;
  w.el.style.zIndex = openPicker && openPicker.w === w ? 99999 : Math.round(w.y);
  w.el.querySelector('.cat-flip').classList.toggle('left', w.face < 0);
}
function renderWalker(w) {
  const a = w.a, d = BY_ID[a.id];
  w.el.classList.toggle('ripe', a.r);
  w.el.querySelector('.ext').innerHTML = a.r
    ? CAT_HEARTS.map(([x, y], i) => `<span class="fr prod" style="left:${x}%;top:${y}%;--i:${i}">${d.prod}</span>`).join('')
    : `<div class="want">${FOODS[d.food].icon}</div>`;
  w.el.querySelector('.wk-pips').innerHTML = a.r ? ''
    : Array.from({ length: d.feeds }, (_, i) => `<i class="${i < a.f ? 'full' : ''}"></i>`).join('');
}
function setMode(w, mode, until = 0) {
  if (w.mode === 'flee' && mode !== 'flee') {
    w.el.classList.remove('scared');
    w.cool = performance.now() + 1500;
  }
  w.mode = mode;
  w.until = until;
  w.el.classList.toggle('walking', mode === 'walk' || mode === 'flee');
  w.el.classList.toggle('fleeing', mode === 'flee');
}
// adaugă o clasă de animație și o scoate după un timp
function pulseClass(el, cls, ms) {
  restart(el, cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

// castraveții de care se sperie: cei de pe jos și cei copți din grădină
function findThreats() {
  const list = cukes.map(c => ({ x: c.x, y: c.y }));
  gardenEl.querySelectorAll('.plot.ripe[data-id="castraveti"]:not(.hidden) .area').forEach(el => {
    const g = gardenPoint(el);
    list.push({ x: g.x, y: g.y - g.h * .35 });
  });
  return list;
}

// se duce lângă o plantă (sau un loc oarecare), dar nu lângă castraveți copți
function pickTarget(w) {
  const b = bounds;
  const spots = [...gardenEl.querySelectorAll('.plot:not(.hidden)')]
    .filter(el => !(el.dataset.id === 'castraveti' && el.classList.contains('ripe')));
  let p;
  if (spots.length && Math.random() < .75) {
    const g = gardenPoint(pick(spots).querySelector('.area'));
    p = { x: g.x + pick([-1, 1]) * (g.w / 2 + rand(10, 40)), y: g.y + rand(-12, 18) };
  } else {
    p = { x: rand(b.x0, b.x1), y: rand(b.y0, b.y1) };
  }
  w.tx = clamp(p.x, b.x0, b.x1);
  w.ty = clamp(p.y, b.y0, b.y1);
  w.speed = rand(55, 85);
  setMode(w, 'walk');
}

function scare(w, from) {
  if (!walkers.has(w.a.u)) return;
  w.face = from.x >= w.x ? 1 : -1;
  setMode(w, 'scared');
  w.el.classList.add('scared');
  placeWalker(w);
  pulseClass(w.el, 'jump', 650);
  Sound.scared();
  const bub = document.createElement('div');
  bub.className = 'scare-bub';
  bub.textContent = '🙀❗';
  w.el.appendChild(bub);
  bub.animate([
    { transform: 'translate(-50%,10px) scale(.3)', opacity: 0 },
    { transform: 'translate(-50%,-14px) scale(1.15)', opacity: 1, offset: .2 },
    { transform: 'translate(-50%,-18px) scale(1)', opacity: 1, offset: .8 },
    { transform: 'translate(-50%,-30px) scale(.9)', opacity: 0 },
  ], { duration: 1400, fill: 'forwards' }).finished.then(() => bub.remove(), () => bub.remove());
  setTimeout(() => flee(w, from), 650);
}

// fuge repede în partea cealaltă, cât mai departe de castraveți
function flee(w, from) {
  if (!walkers.has(w.a.u) || w.mode !== 'scared') return;
  const b = bounds, away = Math.atan2(w.y - from.y, w.x - from.x || -w.face);
  const danger = [from, ...threats];
  let best = null, bestD = -1;
  for (let i = 0; i < 10; i++) {
    const ang = away + rand(-.9, .9), dist = rand(240, 400);
    const p = { x: clamp(w.x + Math.cos(ang) * dist, b.x0, b.x1), y: clamp(w.y + Math.sin(ang) * dist, b.y0, b.y1) };
    const dmin = Math.min(...danger.map(c => Math.hypot(c.x - p.x, c.y - p.y)));
    if (dmin > bestD) { best = p; bestD = dmin; }
  }
  w.tx = best.x;
  w.ty = best.y;
  w.speed = 380;
  setMode(w, 'flee');
  Sound.whoosh();
}

function dustPuff(w) {
  const p = document.createElement('div');
  p.className = 'dust';
  p.textContent = '💨';
  roamEl.appendChild(p);
  const x = w.x - w.face * 46, y = w.y - 22;
  p.animate([
    { transform: `translate(${x}px,${y}px) scale(${w.face > 0 ? -.6 : .6},.6)`, opacity: .9 },
    { transform: `translate(${x - w.face * 30}px,${y - 10}px) scale(${w.face > 0 ? -1.2 : 1.2},1.2)`, opacity: 0 },
  ], { duration: 500, easing: 'ease-out' }).finished.then(() => p.remove(), () => p.remove());
}

function stepWalker(w, dt, t) {
  if (w.mode === 'walk' || w.mode === 'flee') {
    const dx = w.tx - w.x, dy = w.ty - w.y, dist = Math.hypot(dx, dy), step = w.speed * dt;
    if (Math.abs(dx) > 2) w.face = dx > 0 ? 1 : -1;
    if (dist <= step) {
      w.x = w.tx; w.y = w.ty;
      setMode(w, 'idle', t + (w.mode === 'flee' ? rand(2200, 3200) : rand(1500, 4500)));
    } else {
      w.x += dx / dist * step;
      w.y += dy / dist * step;
    }
    if (w.mode === 'flee' && t - w.dust > 90) { w.dust = t; dustPuff(w); }
    placeWalker(w);
  } else if (w.mode === 'idle' && t > w.until) {
    pickTarget(w);
  }
  if ((w.mode === 'walk' || w.mode === 'idle') && t > w.cool) {
    const th = threats.find(c => Math.hypot(c.x - w.x, c.y - w.y) < 115);
    if (th) scare(w, th);
  }
}

let lastT = 0, lastCheck = 0;
function roamLoop(t) {
  requestAnimationFrame(roamLoop);
  const dt = Math.min(.1, (t - lastT) / 1000);
  lastT = t;
  if (!walkers.size) return;
  if (t - lastCheck > 250) {
    lastCheck = t;
    bounds = roamBounds();
    threats = findThreats();
    walkers.forEach(w => {
      w.x = clamp(w.x, bounds.x0, bounds.x1); w.y = clamp(w.y, bounds.y0, bounds.y1);
      w.tx = clamp(w.tx, bounds.x0, bounds.x1); w.ty = clamp(w.ty, bounds.y0, bounds.y1);
    });
  }
  walkers.forEach(w => stepWalker(w, dt, t));
}

// bula din care alegi ce îi dai pisicii: pește sau... castravete
function showPicker(w) {
  closePicker();
  const d = BY_ID[w.a.id];
  const pk = document.createElement('div');
  pk.className = 'picker';
  pk.innerHTML = [d.food, 'cucumber'].map(k =>
    `<button class="pick${state.food[k] ? '' : ' none'}" data-food="${k}" aria-label="Dă-i ${FOODS[k].name.toLowerCase()}">${FOODS[k].icon}<b>${state.food[k]}</b></button>`).join('');
  if (w.y - CAT_H - gardenEl.scrollTop < 120) pk.classList.add('below');
  w.el.appendChild(pk);
  setMode(w, 'menu');
  openPicker = { w, el: pk, timer: setTimeout(closePicker, 6000) };
  placeWalker(w);
}
function closePicker() {
  if (!openPicker) return;
  const { w, el, timer } = openPicker;
  openPicker = null;
  clearTimeout(timer);
  el.remove();
  if (w.mode === 'menu') setMode(w, 'idle', performance.now() + 700);
  placeWalker(w);
}

function feedCat(w, food) {
  closePicker();
  const a = w.a, d = BY_ID[a.id];
  if (state.food[food] < 1) { needFood(food); return; }
  if (food === 'cucumber') { throwCucumber(w); return; }
  busy.add(a.u);
  setMode(w, 'eat');
  const from = center((chipEl(food) || w.el).getBoundingClientRect());
  state.food[food]--;
  a.f++;
  if (a.f >= d.feeds) { a.r = true; a.f = 0; }
  save();
  renderPantry();
  bumpEl(chipEl(food));

  const ar = w.el.querySelector('.area').getBoundingClientRect();
  const to = { x: ar.left + ar.width * (w.face > 0 ? .86 : .14), y: ar.top + ar.height * .5 };
  const fl = document.createElement('div');
  fl.className = 'flyer';
  fl.textContent = FOODS[food].icon;
  fl.style.fontSize = '40px';
  Sound.click();
  fly(fl, from, to, { dur: 750, lift: 110, s0: .9, s1: .5, spin: 40 }).then(() => {
    pulseClass(w.el, 'munch', 650);
    Sound.munch();
    burst(to.x, to.y - 10, 6, ['💛', '✨', '💖']);
    setTimeout(() => Sound.voice(d.voice), 320);
    setTimeout(() => {
      renderWalker(w);
      if (a.r) celebrate(w.el);
      busy.delete(a.u);
      setMode(w, 'idle', performance.now() + 1500);
    }, 650);
  });
}

// castravetele aterizează lângă pisică... și ea se sperie și fuge
function throwCucumber(w) {
  setMode(w, 'eat');
  state.food.cucumber--;
  save();
  const from = center((chipEl('cucumber') || w.el).getBoundingClientRect());
  renderPantry();
  const b = bounds || roamBounds();
  const spot = { x: clamp(w.x + w.face * 72, b.x0, b.x1), y: w.y + 4 };
  const fl = document.createElement('div');
  fl.className = 'flyer';
  fl.textContent = '🥒';
  fl.style.fontSize = '42px';
  Sound.click();
  const to = toScreen(spot);
  fly(fl, from, { x: to.x, y: to.y - 20 }, { dur: 750, lift: 120, s0: 1, s1: 1, spin: 200 }).then(() => {
    dropCuke(spot);
    scare(w, spot);
  });
}
function dropCuke(spot) {
  const el = document.createElement('div');
  el.className = 'cuke';
  el.innerHTML = '<span>🥒</span>';
  el.setAttribute('aria-label', 'Castravete');
  el.style.transform = `translate(${Math.round(spot.x - 21)}px,${Math.round(spot.y - 40)}px)`;
  el.style.zIndex = Math.round(spot.y);
  roamEl.appendChild(el);
  const c = { el, x: spot.x, y: spot.y };
  // după o vreme castravetele se întoarce în cămară (pisica oricum nu-l mănâncă)
  c.timer = setTimeout(() => returnCuke(c), 9000);
  cukes.push(c);
  threats = findThreats();
}
function returnCuke(c) {
  if (!c || !cukes.includes(c)) return;
  clearTimeout(c.timer);
  cukes = cukes.filter(x => x !== c);
  const from = center(c.el.getBoundingClientRect());
  c.el.remove();
  state.food.cucumber++;
  save();
  renderPantry();
  threats = findThreats();
  const chip = chipEl('cucumber');
  if (!chip) return;
  const fl = document.createElement('div');
  fl.className = 'flyer';
  fl.textContent = '🥒';
  fl.style.fontSize = '38px';
  fly(fl, from, center(chip.getBoundingClientRect()), { dur: 700, lift: 100, s0: 1, s1: .6, spin: -90 }).then(() => bumpEl(chipEl('cucumber')));
}

function collectCat(w) {
  const a = w.a, d = BY_ID[a.id];
  a.r = false; a.f = 0;
  setMode(w, 'eat');
  payout(w.el, a.u, d.reward, () => {
    renderWalker(w);
    pulseClass(w.el, 'hop', 700);
    Sound.voice(d.voice);
    setMode(w, 'idle', performance.now() + 1200);
  });
}

/* =========================================================
   EVENIMENTE
   ========================================================= */
tabsEl.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b || b.dataset.tab === state.tab) return;
  Sound.init(); Sound.click();
  setTab(b.dataset.tab);
});

gridEl.addEventListener('click', e => {
  const it = e.target.closest('.item');
  if (!it) return;
  Sound.init();
  const d = BY_ID[it.dataset.id];
  if (isAnimal(d)) buyAnimal(d, it);
  else if (d.cat === 'food') (d.supply === 'water' ? buyWater : buyFood)(d, it);
  else if (d.cat === 'fence') openPenChooser(d, it);
  else buy(d, it);
});

tankEl.addEventListener('click', () => {
  Sound.init();
  buyWater(BY_ID.apa, tankEl);
});

pantryEl.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  Sound.init(); Sound.click();
  showInShop(SUPPLY_FOR[c.dataset.food]);
});

gardenEl.addEventListener('click', e => {
  const ck = e.target.closest('.cuke');
  if (ck) {
    Sound.init(); Sound.pop();
    returnCuke(cukes.find(c => c.el === ck));
    return;
  }
  const wk = e.target.closest('.walker');
  if (wk) {
    Sound.init();
    const w = walkers.get(+wk.dataset.u);
    if (!w || w.el.classList.contains('hidden')) return;
    const pb = e.target.closest('.pick');
    if (pb) { feedCat(w, pb.dataset.food); return; }
    // când e speriată sau fuge, n-o poți prinde!
    if (busy.has(w.a.u) || ['scared', 'flee', 'eat'].includes(w.mode)) return;
    if (openPicker && openPicker.w === w) { closePicker(); return; }
    if (w.a.r) { collectCat(w); return; }
    Sound.voice(BY_ID[w.a.id].voice);
    showPicker(w);
    return;
  }
  const ghost = e.target.closest('.pen-ghost');
  if (ghost) {
    // țarc gol: arătăm în magazin ce se poate pune în el
    const kind = ghost.closest('.pen').dataset.kind;
    Sound.init(); Sound.click();
    if (PLANT_CATS.includes(kind)) setTab(kind);
    else showInShop(kind);
    return;
  }
  const el = e.target.closest('.plot');
  if (!el || el.classList.contains('hidden')) return;
  const u = +el.dataset.u;
  if (busy.has(u)) return;
  const p = state.plants.find(x => x.u === u);
  if (p) {
    Sound.init();
    if (p.s >= 3) harvest(el, p);
    else water(el, p);
    return;
  }
  const a = state.animals.find(x => x.u === u);
  if (!a) return;
  Sound.init();
  if (a.r) collect(el, a);
  else feed(el, a);
});

penModal.addEventListener('click', e => {
  if (e.target === penModal) { closePenChooser(); return; }
  const k = e.target.closest('.kopt');
  if (k && !k.disabled) buildPen(k.dataset.kind);
});
$('penNo').addEventListener('click', closePenChooser);

function renderSoundBtn() { soundBtn.textContent = state.muted ? '🔇' : '🔊'; }
soundBtn.addEventListener('click', () => {
  state.muted = !state.muted;
  save();
  renderSoundBtn();
  Sound.init(); Sound.click();
});

const modal = $('modal');
$('resetBtn').addEventListener('click', () => { Sound.init(); Sound.click(); modal.hidden = false; });
$('noBtn').addEventListener('click', () => { modal.hidden = true; });
modal.addEventListener('click', e => { if (e.target === modal) modal.hidden = true; });
$('yesBtn').addEventListener('click', () => {
  const muted = state.muted;
  state = freshState();
  state.muted = muted;
  shownCoins = state.coins;
  shownWater = state.water;
  busy.clear();
  fxEl.innerHTML = '';
  save();
  modal.hidden = true;
  renderAll();
  Sound.pop();
});

function renderAll() {
  renderTabs();
  renderShop();
  renderCoins();
  renderGarden();
  renderSoundBtn();
  renderTank();
  renderPantry();
}

renderAll();
// nivelul apei apare direct la pornire, fără să curgă
requestAnimationFrame(() => requestAnimationFrame(() => tankEl.classList.remove('init')));
// bula cu mâncare pentru pisică se închide când apeși în altă parte
document.addEventListener('click', e => { if (!e.target.closest('.walker')) closePicker(); }, true);
requestAnimationFrame(roamLoop);
})();
</script>
</body>
